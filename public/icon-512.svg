<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <clipPath id="rounded-square">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  
  <!-- Letter "C" - main shape -->
  <path d="
    M 320 140
    C 270 140, 210 180, 210 256
    C 210 332, 270 372, 320 372
    C 345 372, 365 365, 380 350
  " fill="none" stroke="white" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Spark / star accent -->
  <g transform="translate(340, 140)">
    <path d="M0,-20 L4,-6 L18,-6 L7,3 L11,17 L0,9 L-11,17 L-7,3 L-18,-6 L-4,-6 Z" fill="url(#flame)"/>
  </g>
  
  <!-- Small decorative dots -->
  <circle cx="160" cy="160" r="8" fill="white" opacity="0.3"/>
  <circle cx="140" cy="380" r="6" fill="white" opacity="0.2"/>
  <circle cx="380" cy="420" r="5" fill="white" opacity="0.15"/>
</svg>
